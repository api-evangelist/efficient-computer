aid: efficient-computer
name: Efficient Computer
description: >-
  Efficient Computer builds general-purpose, energy-minimal processors for edge
  and embedded AI. Its Fabric architecture is a reconfigurable spatial dataflow
  array that maps application graphs directly onto hardware, eliminating the
  wasteful data movement of traditional Von Neumann CPUs. The Electron E1
  processor pairs the Fabric with an integrated RISC-V scalar core to deliver up
  to 100x better energy efficiency than low-power CPUs, and the proprietary effcc
  compiler acts as a drop-in replacement for GCC/Clang that extracts dataflow
  from C, C++, and TensorFlow Lite while preserving GDB-compatible debugging.
  Efficient Computer is a silicon and developer-toolchain company based in
  Pittsburgh, Pennsylvania, backed by Union Square Ventures, targeting on-device
  AI inference, IoT, and industrial and physical-AI systems that must run for
  years on a single charge.
